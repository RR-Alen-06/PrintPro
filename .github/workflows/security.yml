# =============================================================================
# PrintPro – Security Scan & Audit
# Runs weekly and on pushes to main.
# Includes: npm audit, secret scanning (Gitleaks), ESLint security analysis.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Dependency vulnerability scan
  # ---------------------------------------------------------------------------
  dep-audit:
    name: Dep Audit · Root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --prefer-offline

      - name: npm audit
        run: npm audit --audit-level=moderate --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30

      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 2. Secret / credential leak detection (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

