# =============================================================================
# PrintPro – Vercel Production Deploy
# Fires on every push (merge) to `main` AFTER the CI gate passes.
# =============================================================================

name: Deploy · Production

on:
  push:
    branches: [main]

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate: re-run CI before deploying to production
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate (pre-deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Production deploy to Vercel
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Vercel Production
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}

    steps:
      - name: Check Vercel token
        id: check-token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN not set; skipping production deploy."
          fi

      - name: Checkout repository
        if: steps.check-token.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        if: steps.check-token.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        if: steps.check-token.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        if: steps.check-token.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project (via Vercel)
        if: steps.check-token.outputs.enabled == 'true'
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel (production)
        if: steps.check-token.outputs.enabled == 'true'
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes > deployment_url.txt
          URL=$(tail -n 1 deployment_url.txt | tr -d '\n\r')
          echo "production_url=$URL" >> $GITHUB_OUTPUT

      - name: Print deployment URL
        if: steps.check-token.outputs.enabled == 'true'
        run: |
          echo "✅ Production deployed to: ${{ steps.deploy.outputs.production_url }}"

      # ---- Create a GitHub Release tag for every production deploy ----------
      - name: Create deployment tag
        if: steps.check-token.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const now = new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19);
            const tagName = `deploy-${now}-${sha}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: context.sha,
            });
            console.log(`Tagged production deploy as ${tagName}`);

