# =============================================================================
# PrintPro – Continuous Integration
# Runs on every push to main/develop and every Pull Request targeting main/develop.
# Jobs: typecheck & lint, security audit.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Type Check & Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. Security Audit
  # ---------------------------------------------------------------------------
  audit:
    name: Audit · Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: npm audit (high+critical only)
        run: npm audit --audit-level=high
        continue-on-error: false

  # ---------------------------------------------------------------------------
  # 3. Final gate – all jobs must pass before merging
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate ✅
    runs-on: ubuntu-latest
    needs: [lint, audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI checks passed."

