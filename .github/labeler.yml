# =============================================================================
# PrintPro – Labeler Configuration
# Used by pr-checks.yml → actions/labeler to auto-label PRs by changed files.
# =============================================================================

application:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "public/**"]

database:
  - changed-files:
      - any-glob-to-any-file: ["schema.sql", "supabase/**"]

ci/cd:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**"]

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - ".github/dependabot.yml"

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "*.config.*"
          - ".env*"
          - "tsconfig.json"
          - "vercel.json"

