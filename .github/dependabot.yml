# =============================================================================
# PrintPro – GitHub Dependabot Configuration
# Automatically opens PRs for outdated dependencies.
# =============================================================================

version: 2

updates:
  # --------------------------------------------------------------------------
  # Root workspace – npm (Next.js / React)
  # --------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    reviewers: []
    ignore:
      # Keep major versions stable unless explicitly upgraded
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # --------------------------------------------------------------------------
  # GitHub Actions – keep action versions up to date
  # --------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"

